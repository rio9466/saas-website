openapi: 3.0.3
info:
  title: easy-admin Server API
  version: 0.5.0
  description: |
    easy-admin Go service API. Health probes plus administrator authentication,
    RBAC management, read-only audit APIs, and the business-user platform
    (public settings, registration, verification, authentication, and
    administrator-managed users/levels/points/system settings). Site-content
    foundation: public branding/navigation/home/features/pricing/pages/docs
    reads and administrator content CRUD with RBAC and pending-first audit.
    All responses use the shared JSON envelope with a request ID. Persistent IDs
    are decimal strings; timestamps are UTC RFC 3339; point values are fixed
    four-decimal strings (for example "123.4567") to avoid JavaScript precision
    loss; money values are two-decimal strings.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: health
    description: Process liveness and dependency readiness
  - name: admin-auth
    description: Administrator authentication and current profile
  - name: admin-users
    description: Administrator account management
  - name: admin-roles
    description: Roles and permissions
  - name: admin-audit
    description: Immutable audit/security event reads
  - name: public-settings
    description: Public platform settings whitelist
  - name: user-auth
    description: Business-user registration, verification, and authentication
  - name: user-profile
    description: Authenticated business-user profile (/me)
  - name: admin-business-users
    description: Administrator management of business users
  - name: admin-user-levels
    description: Business-user level management
  - name: admin-system-settings
    description: Typed platform system settings
  - name: public-content
    description: Unauthenticated public site-content reads (branding, navigation, pages, docs)
  - name: admin-content
    description: Administrator site-content CRUD
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Reports process liveness without querying PostgreSQL, Redis, or other dependencies.
      operationId: getHealthz
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzSuccess'
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Checks primary PostgreSQL, log PostgreSQL, and Redis connectivity with
        bounded timeouts. Returns HTTP 503 and application code 50001 when any
        required dependency is unavailable.
      operationId: getReadyz
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: All required dependencies are reachable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzSuccess'
        '503':
          description: One or more required dependencies are unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzError'
  /api/v1/admin/auth/login:
    post:
      tags: [admin-auth]
      summary: Administrator login
      operationId: adminLogin
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login succeeded; refresh token is set only as HttpOnly cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: HttpOnly refresh cookie scoped to /api/v1/admin/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/auth/refresh:
    post:
      tags: [admin-auth]
      summary: Rotate refresh cookie and issue access token
      operationId: adminRefresh
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Refresh succeeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '401':
          description: Invalid, missing, or replayed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/auth/logout:
    post:
      tags: [admin-auth]
      summary: Revoke current session
      operationId: adminLogout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/me:
    get:
      tags: [admin-auth]
      summary: Current administrator profile
      operationId: adminMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Profile with role and effective permission codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [admin-auth]
      summary: Update current administrator display name
      description: |
        Updates only the display_name of the currently authenticated administrator.
        Any authenticated and enabled administrator may change their own display
        name; admin.user.update is not required. The DTO never accepts administrator
        ID, username, roles, permissions, or enabled state. The write is audited as
        administrator.profile_update with the pending-first protocol and fails
        closed when the log store is unavailable.
      operationId: adminUpdateMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1 }
      responses:
        '200':
          description: Updated profile (same shape as /me)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/me/password:
    post:
      tags: [admin-auth]
      summary: Change current password and revoke session
      operationId: adminChangePassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8, maxLength: 72, description: "UTF-8 encoded byte length between 8 and 72" }
      responses:
        '200':
          description: Password changed; session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators:
    get:
      tags: [admin-users]
      summary: List administrators
      operationId: listAdministrators
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated administrators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorPageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-users]
      summary: Create administrator
      operationId: createAdministrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role_codes]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8, maxLength: 72, description: "UTF-8 encoded byte length between 8 and 72" }
                display_name: { type: string }
                role_codes:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators/{id}:
    get:
      tags: [admin-users]
      summary: Get administrator by id
      operationId: getAdministrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Administrator detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin-users]
      summary: Update administrator profile
      operationId: updateAdministrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators/{id}/enable:
    post:
      tags: [admin-users]
      summary: Enable administrator
      operationId: enableAdministrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators/{id}/disable:
    post:
      tags: [admin-users]
      summary: Disable administrator
      operationId: disableAdministrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators/{id}/reset-password:
    post:
      tags: [admin-users]
      summary: Reset administrator password
      operationId: resetAdministratorPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, format: password, minLength: 8, maxLength: 72, description: "UTF-8 encoded byte length between 8 and 72" }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/administrators/{id}/roles:
    put:
      tags: [admin-users]
      summary: Replace administrator roles
      operationId: assignAdministratorRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_codes]
              properties:
                role_codes:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/roles:
    get:
      tags: [admin-roles]
      summary: List roles
      operationId: listRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-roles]
      summary: Create custom role
      operationId: createRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/roles/{id}:
    get:
      tags: [admin-roles]
      summary: Get role
      operationId: getRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Role detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin-roles]
      summary: Update role
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/roles/{id}/permissions:
    put:
      tags: [admin-roles]
      summary: Replace role permissions
      operationId: replaceRolePermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes]
              properties:
                permission_codes:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Permissions replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/permissions:
    get:
      tags: [admin-roles]
      summary: Permission catalog
      operationId: listPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit-events:
    get:
      tags: [admin-audit]
      summary: List audit events
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [pending, succeeded, failed] } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit-events/{id}:
    get:
      tags: [admin-audit]
      summary: Get audit event
      operationId: getAuditEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Audit event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/settings:
    get:
      tags: [public-settings]
      summary: Public platform settings whitelist
      operationId: getPublicSettings
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Safe public settings (no SMTP secrets, no keys)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettingsSuccess'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/auth/register:
    post:
      tags: [user-auth]
      summary: Self-register a business user
      description: |
        Requires username, email, and password only. Other values are generated
        from validated system defaults. When verification is disabled the
        account is active immediately; otherwise it is pending until a one-time
        verification link succeeds. Registration is rate-limited.
      operationId: userRegister
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64, description: "No '@'; letters, digits, '.', '_', '-' only" }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8, maxLength: 72, description: "UTF-8 encoded byte length between 8 and 72" }
      responses:
        '201':
          description: Registered; profile reflects pending or active status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/RegistrationDisabled'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/auth/verify-email:
    post:
      tags: [user-auth]
      summary: Redeem a one-time email verification token
      description: |
        The token is single-use (atomic GETDEL) and expiring; replay or wrong
        recipient is rejected generically. On success the pending account is
        activated and registration starting points are granted once.
      operationId: userVerifyEmail
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/VerificationInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/auth/resend-verification:
    post:
      tags: [user-auth]
      summary: Resend verification email
      description: |
        Invalidates the previous token and stores a fresh one. Rate-limited and
        never reveals whether an email exists (generic response). SMTP failures
        abort without changing the stored token.
      operationId: userResendVerification
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Verification email resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          $ref: '#/components/responses/VerificationInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/auth/login:
    post:
      tags: [user-auth]
      summary: Business-user login
      description: |
        One identifier field: an '@'-containing identifier is treated as email
        when email login is enabled, otherwise as username. Disabled methods are
        rejected with a safe generic response. Refresh token is only set as an
        HttpOnly cookie scoped to /api/v1/auth; last_login_at updates only here.
      operationId: userLogin
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: HttpOnly user refresh cookie scoped to /api/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
