      summary: Update system settings with optimistic locking
      description: |
        version must match the current row or the write is rejected (no silent
        last-write-wins). smtp_password is write-only: blank retains the stored
        secret; the response only reports password_configured. Enabling email
        verification requires a complete, decryptable, enabled SMTP setup and
        rejects both-login-modes-disabled states.
      operationId: updateSystemSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform_name, public_frontend_url, public_api_url, registration_enabled, username_login_enabled, email_login_enabled, email_verification_required, default_level_id, registration_points, smtp_enabled, smtp_host, smtp_port, smtp_username, smtp_from_email, smtp_from_name, smtp_tls_mode, version]
              properties:
                platform_name: { type: string, minLength: 1 }
                public_frontend_url: { type: string, format: uri }
                public_api_url: { type: string, format: uri }
                registration_enabled: { type: boolean }
                username_login_enabled: { type: boolean }
                email_login_enabled: { type: boolean }
                email_verification_required: { type: boolean }
                default_level_id: { type: string, pattern: '^[0-9]+$' }
                default_avatar_url: { type: string }
                registration_points: { type: string, pattern: '^[0-9]+\.[0-9]{4}$' }
                smtp_enabled: { type: boolean }
                smtp_host: { type: string }
                smtp_port: { type: integer, minimum: 0, maximum: 65535 }
                smtp_username: { type: string }
                smtp_password: { type: string, description: "Write-only; blank retains the stored secret" }
                smtp_from_email: { type: string }
                smtp_from_name: { type: string }
                smtp_tls_mode: { type: string, enum: [none, starttls, ssl] }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SettingsConflict'
        '503':
