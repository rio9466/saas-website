          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional inbound request ID. Accepted only when 1-128 characters and
        every character is ASCII alphanumeric or one of `.`, `_`, `:`, `-`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    Locale:
      name: locale
      in: query
      required: false
      description: Requested locale; unknown or disabled values fall back to the default locale.
      schema:
        type: string
    Placement:
      name: placement
      in: query
      required: false
      description: Navigation placement filter (defaults to header).
      schema:
        type: string
        enum: [header, footer]
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    RequestID:
      description: Echoed or generated request ID
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
  responses:
    Unauthorized:
      description: Authentication required, session invalid, replayed token, or account disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    AccountDisabled:
      description: Account is disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDisabledError'
    AuditUnavailable:
      description: A mandatory audit write could not be persisted; the operation was not completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditUnavailableError'
    Forbidden:
      description: Authenticated but missing permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    Conflict:
      description: Conflict / invariant violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    RegistrationDisabled:
      description: Registration is disabled by system settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationDisabledError'
    VerificationInvalid:
      description: Verification token is invalid, expired, replayed, or unused
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationInvalidError'
    RateLimited:
      description: Too many attempts; try again later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
    DependencyUnavailable:
      description: A required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DependencyUnavailableError'
    PointsConflict:
      description: Points invariant violation (insufficient balance or idempotency replay)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointsConflictError'
    SettingsConflict:
      description: Optimistic-lock version mismatch; settings did not change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SettingsConflictError'
  schemas:
    Envelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { type: object, additionalProperties: true }
        request_id: { type: string, minLength: 1 }
    HealthzSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            message: { enum: [success] }
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ok] }
    ReadyzSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            message: { enum: [success] }
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ready] }
    ReadyzError:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [50001] }
            message: { enum: [dependency unavailable] }
            data: { type: object, additionalProperties: false }
    LoginSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            data:
              type: object
              required: [access_token, token_type, expires_in]
              properties:
                access_token: { type: string }
