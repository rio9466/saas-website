  /api/v1/admin/users/{id}/points-adjust:
    post:
      tags: [admin-business-users]
      summary: Adjust available and consumption points atomically
      description: |
        One primary-database transaction with row locking writes an immutable
        ledger row and updates balances. Retrying the same idempotency_key is a
        conflict and never applies twice. Available balance cannot become
        negative; consumption points cannot be reduced. Auto-mode levels
        recalculate when consumption grows.
      operationId: adjustBusinessUserPoints
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points_delta, consumption_delta, reason, idempotency_key]
              properties:
                points_delta: { type: string, pattern: '^[0-9]+\.[0-9]{4}$', description: "Fixed four-decimal string; negative like -5.0000 allowed" }
                consumption_delta: { type: string, pattern: '^[0-9]+\.[0-9]{4}$', description: "Fixed four-decimal string; must be zero or greater" }
                reason: { type: string, minLength: 1, maxLength: 200 }
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Ledger row written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointTransactionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PointsConflict'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
