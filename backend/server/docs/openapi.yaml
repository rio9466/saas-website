        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                icon_url: { type: string }
                threshold_points: { type: string, pattern: '^[0-9]+\.[0-9]{4}$' }
                sort_order: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLevelSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
  /api/v1/admin/system-settings:
    get:
      tags: [admin-system-settings]
      summary: Read typed system settings
      description: SMTP password is exposed only as password_configured.
      operationId: getSystemSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Typed settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin-system-settings]
      summary: Update system settings with optimistic locking
      description: |
        version must match the current row or the write is rejected (no silent
        last-write-wins). smtp_password is write-only: blank retains the stored
        secret; the response only reports password_configured. Enabling email
        verification requires a complete, decryptable, enabled SMTP setup and
        rejects both-login-modes-disabled states.
      operationId: updateSystemSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform_name, public_frontend_url, public_api_url, registration_enabled, username_login_enabled, email_login_enabled, email_verification_required, default_level_id, registration_points, smtp_enabled, smtp_host, smtp_port, smtp_username, smtp_from_email, smtp_from_name, smtp_tls_mode, version]
              properties:
                platform_name: { type: string, minLength: 1 }
                public_frontend_url: { type: string, format: uri }
                public_api_url: { type: string, format: uri }
                registration_enabled: { type: boolean }
                username_login_enabled: { type: boolean }
                email_login_enabled: { type: boolean }
                email_verification_required: { type: boolean }
                default_level_id: { type: string, pattern: '^[0-9]+$' }
                default_avatar_url: { type: string }
                registration_points: { type: string, pattern: '^[0-9]+\.[0-9]{4}$' }
                smtp_enabled: { type: boolean }
                smtp_host: { type: string }
                smtp_port: { type: integer, minimum: 0, maximum: 65535 }
                smtp_username: { type: string }
                smtp_password: { type: string, description: "Write-only; blank retains the stored secret" }
                smtp_from_email: { type: string }
                smtp_from_name: { type: string }
                smtp_tls_mode: { type: string, enum: [none, starttls, ssl] }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SettingsConflict'
        '503':
          $ref: '#/components/responses/AuditUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional inbound request ID. Accepted only when 1-128 characters and
        every character is ASCII alphanumeric or one of `.`, `_`, `:`, `-`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
  headers:
    RequestID:
      description: Echoed or generated request ID
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
  responses:
    Unauthorized:
      description: Authentication required, session invalid, replayed token, or account disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    AccountDisabled:
      description: Account is disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDisabledError'
    AuditUnavailable:
      description: A mandatory audit write could not be persisted; the operation was not completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditUnavailableError'
    Forbidden:
      description: Authenticated but missing permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    Conflict:
      description: Conflict / invariant violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    RegistrationDisabled:
      description: Registration is disabled by system settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationDisabledError'
    VerificationInvalid:
      description: Verification token is invalid, expired, replayed, or unused
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationInvalidError'
    RateLimited:
      description: Too many attempts; try again later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
    DependencyUnavailable:
      description: A required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DependencyUnavailableError'
    PointsConflict:
      description: Points invariant violation (insufficient balance or idempotency replay)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointsConflictError'
    SettingsConflict:
      description: Optimistic-lock version mismatch; settings did not change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SettingsConflictError'
  schemas:
    Envelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { type: object, additionalProperties: true }
        request_id: { type: string, minLength: 1 }
    HealthzSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            message: { enum: [success] }
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ok] }
    ReadyzSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            message: { enum: [success] }
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ready] }
    ReadyzError:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [50001] }
            message: { enum: [dependency unavailable] }
            data: { type: object, additionalProperties: false }
    LoginSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            data:
              type: object
              required: [access_token, token_type, expires_in]
              properties:
                access_token: { type: string }
                token_type: { type: string, enum: [Bearer] }
                expires_in: { type: integer, enum: [900] }
              additionalProperties: false
    MeSuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            data:
              $ref: '#/components/schemas/AdministratorProfile'
    EmptySuccess:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code: { enum: [0] }
            data: { type: object, additionalProperties: false }
    AdministratorProfile:
      type: object
      required: [id, username, display_name, enabled, role_codes, permission_codes, created_at, updated_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        enabled: { type: boolean }
        role_codes: { type: array, items: { type: string } }
        permission_codes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Administrator:
      type: object
      required: [id, username, display_name, enabled, role_codes, created_at, updated_at]
